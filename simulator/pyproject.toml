[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dm3-simulator"
version = "0.1.0"
description = "DM3 Device Simulator — asyncio access control device simulator"
requires-python = ">=3.11"
dependencies = [
    "aiomqtt>=2.0.0",
    "aiosqlite>=0.19.0",
    "aiohttp>=3.9.0",
    "click>=8.1.0",
    "structlog>=23.2.0",
    "prometheus-client>=0.19.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "pytz>=2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[project.scripts]
dm3-simulator = "dm3_simulator.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
