<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Duall Master — Choose Your Language</title>
  <meta name="description" content="Duall Master - Unified Building Security & Facility Management Platform. Select your language.">
  <link rel="alternate" hreflang="en" href="/en/">
  <link rel="alternate" hreflang="ko" href="/ko/">
  <link rel="alternate" hreflang="vi" href="/vi/">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .lang-select-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .lang-select-logo {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    .lang-select-logo span {
      color: var(--accent, #3B82F6);
    }
    .lang-select-subtitle {
      color: var(--text-secondary, #94A3B8);
      font-size: 1rem;
      margin-bottom: 3rem;
    }
    .lang-options {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .lang-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 2rem 2.5rem;
      border: 1px solid var(--border-strong, #334155);
      border-radius: 12px;
      background: var(--surface-1, #1E293B);
      text-decoration: none;
      color: #fff;
      transition: all 0.2s ease;
      min-width: 180px;
    }
    .lang-option:hover {
      border-color: var(--accent, #3B82F6);
      background: rgba(59, 130, 246, 0.05);
      transform: translateY(-2px);
    }
    .lang-option .flag {
      font-size: 2.5rem;
      line-height: 1;
    }
    .lang-option .lang-name {
      font-size: 1.125rem;
      font-weight: 600;
    }
    .lang-option .lang-native {
      font-size: 0.875rem;
      color: var(--text-secondary, #94A3B8);
    }
    .lang-suggestion {
      margin-top: 2rem;
      padding: 0.75rem 1.5rem;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 8px;
      color: var(--text-secondary, #94A3B8);
      font-size: 0.875rem;
      display: none;
    }
    .lang-suggestion a {
      color: var(--accent, #3B82F6);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
  <script>
    // Auto-redirect if language preference is saved
    (function() {
      var saved = localStorage.getItem('dm3-lang');
      if (saved && ['/en/', '/ko/', '/vi/'].indexOf(saved) !== -1) {
        window.location.href = saved;
      }
    })();
  </script>
  
  <link rel="canonical" href="https://duallmaster.com/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Duall Master — Choose Your Language">
  <meta property="og:description" content="Duall Master - Unified Building Security & Facility Management Platform. Select your language.">
  <meta property="og:url" content="https://duallmaster.com/">
  <meta property="og:image" content="https://duallmaster.com/images/og-default.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Duall Master — Choose Your Language">
  <meta name="twitter:description" content="Duall Master - Unified Building Security & Facility Management Platform. Select your language.">
<!-- Replace GTM-XXXXXXX with your actual GTM container ID -->
<!-- Google Tag Manager (loaded conditionally via cookie-consent.js) -->
<script>window.dataLayer = window.dataLayer || [];</script>
  <!-- TODO: Generate og:image from the AI Vision Shield logo (favicon.svg) -->
</head>
<body>
<!-- Google Tag Manager (noscript) - Replace GTM-XXXXXXX with your actual GTM container ID -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <div class="lang-select-page">
    <div class="lang-select-logo" style="display:flex;align-items:center;gap:14px;justify-content:center">
      <svg width="48" height="54" viewBox="0 0 52 58" fill="none">
        <path d="M26 2L4 12V28C4 42 14 52 26 56C38 52 48 42 48 28V12L26 2Z" stroke="#06B6D4" stroke-width="2" fill="none"/>
        <path d="M10 28C10 28 18 18 26 18C34 18 42 28 42 28C42 28 34 38 26 38C18 38 10 28 10 28Z" stroke="#3B82F6" stroke-width="1.5" fill="none"/>
        <circle cx="26" cy="28" r="6" stroke="#06B6D4" stroke-width="1.5" fill="none"/>
        <circle cx="26" cy="28" r="3" fill="#06B6D4"/>
        <line x1="26" y1="12" x2="26" y2="17" stroke="#06B6D4" stroke-width="1" opacity="0.4"/>
        <line x1="26" y1="39" x2="26" y2="46" stroke="#06B6D4" stroke-width="1" opacity="0.4"/>
        <circle cx="16" cy="14" r="1.5" fill="#3B82F6" opacity="0.5"/>
        <circle cx="36" cy="14" r="1.5" fill="#3B82F6" opacity="0.5"/>
        <circle cx="14" cy="42" r="1.5" fill="#8B5CF6" opacity="0.5"/>
        <circle cx="38" cy="42" r="1.5" fill="#8B5CF6" opacity="0.5"/>
      </svg>
      <span style="font-family:'Space Grotesk',sans-serif;line-height:1">
        <span style="font-weight:700;font-size:28px;letter-spacing:2px;color:#fff">DUALL</span><br>
        <span style="font-weight:300;font-size:12px;letter-spacing:4px;color:#94A3B8">MASTER</span>
      </span>
    </div>
    <p class="lang-select-subtitle">Unified Building Security & Facility Management Platform</p>
    
    <div class="lang-options">
      <a href="/en/" class="lang-option" onclick="localStorage.setItem('dm3-lang','/en/')">
        <span class="flag">🇺🇸</span>
        <span class="lang-name">English</span>
        <span class="lang-native">English</span>
      </a>
      <a href="/ko/" class="lang-option" onclick="localStorage.setItem('dm3-lang','/ko/')">
        <span class="flag">🇰🇷</span>
        <span class="lang-name">한국어</span>
        <span class="lang-native">Korean</span>
      </a>
      <a href="/vi/" class="lang-option" onclick="localStorage.setItem('dm3-lang','/vi/')">
        <span class="flag">🇻🇳</span>
        <span class="lang-name">Tiếng Việt</span>
        <span class="lang-native">Vietnamese</span>
      </a>
    </div>

    <div class="lang-suggestion" id="lang-suggestion"></div>
  </div>

  <script>
    // Detect browser language and suggest
    (function() {
      var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      var suggestion = document.getElementById('lang-suggestion');
      if (lang.startsWith('ko')) {
        suggestion.innerHTML = '🇰🇷 한국어를 사용하시나요? <a href="/ko/" onclick="localStorage.setItem(\'dm3-lang\',\'/ko/\')">한국어로 보기</a>';
        suggestion.style.display = 'block';
      } else if (lang.startsWith('vi')) {
        suggestion.innerHTML = '🇻🇳 Bạn dùng tiếng Việt? <a href="/vi/" onclick="localStorage.setItem(\'dm3-lang\',\'/vi/\')">Xem bằng tiếng Việt</a>';
        suggestion.style.display = 'block';
      }
    })();
  </script>
<script src="js/cookie-consent.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
