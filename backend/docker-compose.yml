services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: dm3-timescaledb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: dm3
      POSTGRES_USER: dm3
      POSTGRES_PASSWORD: dm3secret
    volumes:
      - ./data/timescaledb:/var/lib/postgresql/data
    networks:
      - dm3-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dm3"]
      interval: 5s
      timeout: 5s
      retries: 5

  emqx:
    image: emqx/emqx:5.8.3
    container_name: dm3-emqx
    ports:
      - "1884:1883"
      - "18083:18083"
    environment:
      EMQX_NAME: dm3
      EMQX_LOADED_PLUGINS: "emqx_dashboard"
    volumes:
      - ./data/emqx:/opt/emqx/data
    networks:
      - dm3-net
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: dm3-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--jetstream", "--store_dir=/data", "-m", "8222"]
    volumes:
      - ./data/nats:/data
    networks:
      - dm3-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: dm3-valkey
    ports:
      - "6380:6379"
    volumes:
      - ./data/valkey:/data
    networks:
      - dm3-net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dm3-minio
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: dm3admin
      MINIO_ROOT_PASSWORD: dm3secret123
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    networks:
      - dm3-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  simulator:
    build: ../simulator
    container_name: dm3-simulator
    ports:
      - "9090:9090"
    depends_on:
      emqx:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    command: run --devices 5 --broker mqtt://emqx:1883 --site-id site-001 --company-id 00000000-0000-0000-0000-000000000001 --api-port 9090 --device-prefix dm3-dev
    restart: unless-stopped
    environment:
      - DM3_BROKER_URL=mqtt://emqx:1883
    networks:
      - dm3-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  seed-demo:
    image: postgres:16-alpine
    container_name: dm3-seed-demo
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGPASSWORD: dm3secret
    volumes:
      - ./scripts:/scripts
      - ./pkg/db/migrations:/migrations
    command: /scripts/seed-demo.sh
    networks:
      - dm3-net

networks:
  dm3-net:
    driver: bridge
