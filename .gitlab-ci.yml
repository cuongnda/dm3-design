stages:
  - deploy

# ── Deploy: Staging ───────────────────────────────────────────────────────────
# Auto-deploys when develop branch is pushed.
# Shell executor on demo.demasterpro.com — GitLab runner clones repo automatically.

deploy:staging:
  stage: deploy
  environment:
    name: staging
    url: http://dm3.demasterpro.com
  script:
    - echo "=== Deploying DM3 to staging ==="
    - cp /home/gitlab-runner/.env.dm3 .env || true
    # Pass commit SHAs to automation container for change detection
    - export CI_COMMIT_SHA=${CI_COMMIT_SHA}
    - export CI_COMMIT_BEFORE_SHA=${CI_COMMIT_BEFORE_SHA}
    - docker compose -f docker-compose.prod.yml --profile staging down --timeout 30 || true
    - docker compose -f docker-compose.prod.yml --profile staging build --no-cache
    - docker compose -f docker-compose.prod.yml --profile staging up -d --remove-orphans
    - sleep 15
    - echo "=== Service status ==="
    - docker compose -f docker-compose.prod.yml --profile staging ps
  only:
    - develop

# ── Deploy: Production ────────────────────────────────────────────────────────
deploy:production:
  stage: deploy
  environment:
    name: production
    url: http://dm3.demasterpro.com
  script:
    - cp /home/gitlab-runner/.env.dm3 .env || true
    - docker compose -f docker-compose.prod.yml down --timeout 30 || true
    - docker compose -f docker-compose.prod.yml build --no-cache
    - docker compose -f docker-compose.prod.yml up -d --remove-orphans
    - sleep 15
    - docker compose -f docker-compose.prod.yml ps
  only:
    - /^v\d+\.\d+\.\d+$/
  except:
    - branches
  when: manual
