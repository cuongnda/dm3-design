<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, height=1280">
<title>Duall Master — Visitor Check-in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0A0E1A;
  color: #F8FAFC;
  width: 800px;
  height: 1280px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.header {
  display: flex;
  align-items: center;
  padding: 16px 32px;
  height: 64px;
  gap: 16px;
}
.back-btn {
  width: 48px;
  height: 48px;
  background: #1E293B;
  border: 1px solid #334155;
  border-radius: 12px;
  color: #F8FAFC;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.header-title {
  flex: 1;
  font-size: 20px;
  font-weight: 600;
  text-align: center;
}
.lang-sm {
  font-size: 13px;
  color: #94A3B8;
  background: #1E293B;
  border: 1px solid #334155;
  padding: 6px 12px;
  border-radius: 8px;
}

.content {
  flex: 1;
  padding: 24px 32px;
  display: flex;
  flex-direction: column;
  max-width: 664px;
  margin: 0 auto;
  width: 100%;
}

.welcome {
  text-align: center;
  margin-bottom: 32px;
}
.welcome h2 {
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 8px;
}
.welcome p {
  font-size: 16px;
  color: #CBD5E1;
}

.section-label {
  font-size: 13px;
  font-weight: 600;
  color: #64748B;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 12px;
  padding-left: 4px;
}

.purpose-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 32px;
}
.purpose-btn {
  width: 100%;
  height: 72px;
  background: #1E293B;
  border: 1px solid #334155;
  border-radius: 12px;
  color: #F8FAFC;
  font-family: inherit;
  font-size: 18px;
  font-weight: 500;
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.purpose-btn.selected {
  border-color: #2563EB;
  background: #111d35;
}
.purpose-btn .emoji { font-size: 28px; }
.purpose-btn .labels { display: flex; flex-direction: column; gap: 2px; }
.purpose-btn .label-vi { font-size: 18px; font-weight: 500; }
.purpose-btn .label-en { font-size: 13px; color: #94A3B8; font-weight: 400; }

.host-section { margin-top: 8px; }
.search-input {
  width: 100%;
  height: 56px;
  background: #111827;
  border: 1px solid #334155;
  border-radius: 12px;
  color: #F8FAFC;
  font-family: inherit;
  font-size: 18px;
  padding: 0 20px 0 52px;
  outline: none;
  position: relative;
}
.search-wrap {
  position: relative;
  margin-bottom: 16px;
}
.search-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 20px;
  color: #64748B;
  pointer-events: none;
}

.host-list {
  display: flex;
  flex-direction: column;
  border: 1px solid #334155;
  border-radius: 12px;
  overflow: hidden;
}
.host-item {
  display: flex;
  align-items: center;
  padding: 14px 20px;
  gap: 16px;
  border-bottom: 1px solid #1E293B;
  cursor: pointer;
}
.host-item:last-child { border-bottom: none; }
.host-item:hover { background: #1E293B; }
.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 600;
  color: #fff;
  flex-shrink: 0;
}
.avatar.purple { background: #7C3AED; }
.avatar.blue { background: #2563EB; }
.avatar.teal { background: #0D9488; }
.host-info { flex: 1; }
.host-name { font-size: 18px; font-weight: 500; }
.host-dept { font-size: 14px; color: #94A3B8; margin-top: 2px; }
</style>
</head>
<body>

<div class="header">
  <div class="back-btn">←</div>
  <div class="header-title">ĐĂNG KÝ KHÁCH</div>
  <div class="lang-sm">VI / EN</div>
</div>

<div class="content">
  <div class="welcome">
    <h2>Chào mừng! 👋</h2>
    <p>Vui lòng chọn mục đích và người bạn muốn gặp</p>
  </div>

  <div class="section-label">Mục đích / Purpose</div>
  <div class="purpose-list">
    <button class="purpose-btn selected">
      <span class="emoji">🤝</span>
      <div class="labels">
        <span class="label-vi">Họp</span>
        <span class="label-en">Meeting</span>
      </div>
    </button>
    <button class="purpose-btn">
      <span class="emoji">📦</span>
      <div class="labels">
        <span class="label-vi">Giao hàng</span>
        <span class="label-en">Delivery</span>
      </div>
    </button>
    <button class="purpose-btn">
      <span class="emoji">🔧</span>
      <div class="labels">
        <span class="label-vi">Bảo trì</span>
        <span class="label-en">Maintenance</span>
      </div>
    </button>
    <button class="purpose-btn">
      <span class="emoji">🎤</span>
      <div class="labels">
        <span class="label-vi">Phỏng vấn</span>
        <span class="label-en">Interview</span>
      </div>
    </button>
  </div>

  <div class="host-section">
    <div class="section-label">Người tiếp / Host</div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" type="text" placeholder="Tìm theo tên... / Search by name..." value="Nguyễn">
    </div>
    <div class="host-list">
      <div class="host-item">
        <div class="avatar purple">VA</div>
        <div class="host-info">
          <div class="host-name">Nguyễn Văn A</div>
          <div class="host-dept">Phòng Kỹ thuật · Tầng 5</div>
        </div>
      </div>
      <div class="host-item">
        <div class="avatar blue">TB</div>
        <div class="host-info">
          <div class="host-name">Nguyễn Thị B</div>
          <div class="host-dept">Phòng Kinh doanh · Tầng 3</div>
        </div>
      </div>
      <div class="host-item">
        <div class="avatar teal">MC</div>
        <div class="host-info">
          <div class="host-name">Nguyễn Minh C</div>
          <div class="host-dept">Phòng Nhân sự · Tầng 4</div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
