<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, height=1280">
<title>Duall Master — Clock In Confirmation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0A0E1A;
  color: #F8FAFC;
  width: 800px;
  height: 1280px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
  padding: 32px;
}

.success-icon {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: rgba(34, 197, 94, 0.15);
  border: 3px solid #22C55E;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes scaleIn {
  from { transform: scale(0); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.checkmark {
  font-size: 56px;
  line-height: 1;
}

.profile-card {
  background: #1E293B;
  border-radius: 16px;
  padding: 32px 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  min-width: 400px;
}
.avatar-large {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: linear-gradient(135deg, #7C3AED, #8B5CF6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 700;
  color: #fff;
  border: 3px solid #334155;
}
.employee-name {
  font-size: 24px;
  font-weight: 600;
}
.employee-dept {
  font-size: 16px;
  color: #CBD5E1;
}

.clock-display {
  font-size: 56px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: #3B82F6;
  letter-spacing: -0.03em;
  margin: 8px 0;
}
.clock-date {
  font-size: 16px;
  color: #94A3B8;
  margin-top: -16px;
}

.status-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(34, 197, 94, 0.15);
  border: 2px solid #22C55E;
  border-radius: 12px;
  padding: 14px 40px;
  margin-top: 8px;
}
.status-badge .dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #22C55E;
}
.status-badge .label {
  font-size: 20px;
  font-weight: 600;
  color: #22C55E;
}

.auto-return {
  font-size: 14px;
  color: #64748B;
  margin-top: 16px;
}
</style>
</head>
<body>

<div class="container">
  <div class="success-icon">
    <span class="checkmark">✓</span>
  </div>

  <div class="profile-card">
    <div class="avatar-large">VA</div>
    <div class="employee-name">Nguyễn Văn A</div>
    <div class="employee-dept">Phòng Kỹ thuật · Engineering</div>
  </div>

  <div class="clock-display">08:32:15</div>
  <div class="clock-date">Thứ Năm, 19/02/2026</div>

  <div class="status-badge">
    <span class="dot"></span>
    <span class="label">ĐÚNG GIỜ · ON TIME</span>
  </div>

  <div class="auto-return">Tự động về trang chủ: 5s · Auto-return: 5s</div>
</div>

</body>
</html>
