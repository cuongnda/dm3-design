<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, height=1280">
<title>Duall Master — Terminal Home</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0A0E1A;
  color: #F8FAFC;
  width: 800px;
  height: 1280px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 32px;
  height: 64px;
}
.lang-toggle {
  display: flex;
  background: #1E293B;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid #334155;
}
.lang-toggle span {
  padding: 8px 16px;
  font-size: 14px;
  font-weight: 500;
  color: #94A3B8;
  cursor: pointer;
}
.lang-toggle span.active {
  background: #2563EB;
  color: #fff;
}
.time-block { text-align: right; }
.time-block .time {
  font-size: 28px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.time-block .date {
  font-size: 14px;
  color: #94A3B8;
  margin-top: 2px;
}

.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 32px;
  gap: 28px;
}

.branding {
  text-align: center;
  margin-bottom: 8px;
}
.logo-mark {
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, #2563EB, #3B82F6);
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  margin: 0 auto 16px;
}
.brand-name {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 0.08em;
}
.building-name {
  font-size: 20px;
  font-weight: 400;
  color: #CBD5E1;
  margin-top: 4px;
}

.qr-area {
  width: 220px;
  height: 220px;
  position: relative;
  margin: 8px 0;
}
.qr-area .corner {
  position: absolute;
  width: 32px;
  height: 32px;
  border-color: #60A5FA;
  border-style: solid;
  border-width: 0;
}
.qr-area .corner.tl { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; border-radius: 4px 0 0 0; }
.qr-area .corner.tr { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-radius: 0 4px 0 0; }
.qr-area .corner.bl { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; border-radius: 0 0 0 4px; }
.qr-area .corner.br { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-radius: 0 0 4px 0; }
.qr-inner {
  position: absolute;
  inset: 16px;
  background: #111827;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 8px;
}
.qr-inner svg { opacity: 0.3; }
.qr-hint {
  font-size: 14px;
  color: #CBD5E1;
  text-align: center;
  line-height: 1.4;
}

.actions {
  width: 100%;
  max-width: 600px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.btn-primary {
  width: 100%;
  height: 72px;
  background: #2563EB;
  border: none;
  border-radius: 12px;
  color: #fff;
  font-family: inherit;
  font-size: 18px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  cursor: pointer;
}
.btn-row {
  display: flex;
  gap: 12px;
}
.btn-secondary {
  flex: 1;
  height: 72px;
  background: #1E293B;
  border: 1px solid #334155;
  border-radius: 12px;
  color: #F8FAFC;
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
}
.btn-secondary .icon { font-size: 24px; }
.btn-ghost {
  width: 100%;
  height: 56px;
  background: transparent;
  border: 1px solid #334155;
  border-radius: 12px;
  color: #94A3B8;
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
}

.footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: #64748B;
}
</style>
</head>
<body>

<div class="status-bar">
  <div class="lang-toggle">
    <span class="active">VI</span>
    <span>EN</span>
  </div>
  <div class="time-block">
    <div class="time">14:32</div>
    <div class="date">Thứ Năm, 19/02/2026</div>
  </div>
</div>

<div class="main-content">
  <div class="branding">
    <div class="logo-mark"></div>
    <div class="brand-name">DUALL MASTER</div>
    <div class="building-name">Toà nhà Landmark 81</div>
  </div>

  <div class="qr-area">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="qr-inner">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#60A5FA" stroke-width="1.5">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="3" height="3"/>
        <line x1="18" y1="14" x2="18" y2="18"/>
        <line x1="14" y1="18" x2="21" y2="18"/>
        <line x1="21" y1="14" x2="21" y2="21"/>
      </svg>
      <div class="qr-hint">Quét mã QR<br>Scan QR Code</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-primary">
      <span style="font-size:28px">👤</span>
      ĐĂNG KÝ KHÁCH / CHECK IN
    </button>
    <div class="btn-row">
      <button class="btn-secondary">
        <span class="icon">🕐</span>
        <span>CHẤM CÔNG<br><small style="color:#94A3B8;font-weight:400;font-size:13px">Clock In</small></span>
      </button>
      <button class="btn-secondary">
        <span class="icon">📖</span>
        <span>DANH BẠ<br><small style="color:#94A3B8;font-weight:400;font-size:13px">Directory</small></span>
      </button>
    </div>
    <button class="btn-ghost">
      🚪 TRẢ THẺ / CHECK OUT
    </button>
  </div>
</div>

<div class="footer">Powered by Duali</div>

</body>
</html>
