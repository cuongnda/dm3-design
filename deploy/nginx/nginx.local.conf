user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Docker DNS — re-resolve every 10s so restarts pick up new IPs
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        # ── CORS for local dev ──
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Company-ID" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # ── auth-svc — /api/v1/auth/** ──
        location /api/v1/auth/ {
            set $upstream_auth http://auth-svc:8005;
            proxy_pass $upstream_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── device-gateway — /api/v1/gateway/** ──
        location /api/v1/gateway/ {
            set $upstream_gateway http://device-gateway:8002;
            proxy_pass $upstream_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 100M;
        }

        # ── access-svc — /api/v1/access/** ──
        location /api/v1/access/ {
            set $upstream_access http://access-svc:8003;
            proxy_pass $upstream_access;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── audit-svc — /api/v1/audit/** ──
        location /api/v1/audit/ {
            set $upstream_audit http://audit-svc:8001;
            proxy_pass $upstream_audit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── identity-svc — /api/v1/identity/** ──
        location /api/v1/identity/ {
            set $upstream_identity http://identity-svc:8004;
            proxy_pass $upstream_identity;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 10M;
        }

        # ── visitor-svc — /api/v1/visitors/** ──
        location /api/v1/visitors/ {
            set $upstream_visitor http://visitor-svc:8006;
            proxy_pass $upstream_visitor;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── parking-svc — /api/v1/parking/** ──
        location /api/v1/parking/ {
            set $upstream_parking http://parking-svc:8007;
            proxy_pass $upstream_parking;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── cctv-svc — /api/v1/cctv/** (plugin-gated) ──
        location /api/v1/cctv/ {
            set $upstream_cctv http://cctv-svc:8008;
            proxy_pass $upstream_cctv;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 200M;  # manual clip upload
        }

        # ── MediaMTX — WebRTC/WHEP live view ──
        location /cctv/whep/ {
            set $upstream_whep http://mediamtx:8889;
            rewrite ^/cctv/whep/(.*)$ /$1 break;
            proxy_pass $upstream_whep;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── MediaMTX — LL-HLS fallback ──
        location /cctv/hls/ {
            set $upstream_hls http://mediamtx:8888;
            rewrite ^/cctv/hls/(.*)$ /$1 break;
            proxy_pass $upstream_hls;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # ── WebSocket ──
        location /ws/ {
            set $upstream_ws http://device-gateway:8002;
            proxy_pass $upstream_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── identity-svc — photos/avatars ──
        location /photos/ {
            set $upstream_photos http://identity-svc:8004;
            proxy_pass $upstream_photos;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── access-svc — managed tenant assets ──
        location /assets/tenants/ {
            set $upstream_tenant_assets http://access-svc:8003;
            proxy_pass $upstream_tenant_assets;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── webapp static assets ──
        location /assets/ {
            set $upstream_assets http://webapp:80;
            proxy_pass $upstream_assets;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── SPA fallback ──
        location / {
            set $upstream_webapp http://webapp:80;
            proxy_pass $upstream_webapp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
