user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# nginx sits at the edge and owns:
#   - SPA serving (/, /assets/)
#   - static asset proxies to identity-svc and access-svc (/photos/, /assets/tenants/)
#   - MediaMTX proxies (/cctv/whep/, /cctv/hls/) — these are long-lived WebRTC/HLS
#     streams that bypass the API gateway entirely
#   - TLS termination (in prod)
#
# All API traffic (/api/v1/*) and WebSocket traffic (/ws/*) is forwarded to
# Traefik, which owns per-route rate-limit, CORS, security headers, request IDs,
# and the future API-key / OAuth2 plane. See deploy/traefik/ for gateway config.

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Docker DNS — re-resolve every 10s so restarts pick up new IPs
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        # ── API plane → Traefik gateway ──
        # Traefik handles CORS, rate-limit, security headers, request-id,
        # and the future API-key / OAuth2 plane.
        location /api/v1/ {
            set $upstream_traefik http://traefik:80;
            proxy_pass $upstream_traefik;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Support large identity photos (10M) and CCTV clip uploads (200M).
            # Traefik passes through; the service enforces its own limits.
            client_max_body_size 200M;
        }

        # ── WebSocket (device gateway) via Traefik ──
        location /ws/ {
            set $upstream_traefik_ws http://traefik:80;
            proxy_pass $upstream_traefik_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── MediaMTX — WebRTC/WHEP live view (direct; bypasses gateway) ──
        location /cctv/whep/ {
            set $upstream_whep http://mediamtx:8889;
            rewrite ^/cctv/whep/(.*)$ /$1 break;
            proxy_pass $upstream_whep;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── MediaMTX — LL-HLS fallback (direct; bypasses gateway) ──
        location /cctv/hls/ {
            set $upstream_hls http://mediamtx:8888;
            rewrite ^/cctv/hls/(.*)$ /$1 break;
            proxy_pass $upstream_hls;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # ── identity-svc — photos/avatars (direct; not under /api/v1) ──
        location /photos/ {
            set $upstream_photos http://identity-svc:8004;
            proxy_pass $upstream_photos;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── access-svc — managed tenant assets (direct; not under /api/v1) ──
        location /assets/tenants/ {
            set $upstream_tenant_assets http://access-svc:8003;
            proxy_pass $upstream_tenant_assets;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── webapp static assets ──
        location /assets/ {
            set $upstream_assets http://webapp:80;
            proxy_pass $upstream_assets;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── SPA fallback ──
        location / {
            set $upstream_webapp http://webapp:80;
            proxy_pass $upstream_webapp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
