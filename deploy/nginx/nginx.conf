user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/wasm;
    gzip_min_length 1024;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── dm3.demasterpro.com + IP fallback — React SPA ────────────────────────
    # This block is the default_server — serves the webapp + full API routing
    # to any request whose Host header doesn't match another explicit
    # server_name below (so IP-based access works out of the box on fresh
    # installs). Specific server_names (dm3-api, dm3-mqtt, dm3-minio, dm3-s3)
    # still take precedence when their hostname matches.
    server {
        listen 80 default_server;
        server_name dm3.demasterpro.com _;

        # Simple health probe (same path as before; returns 200 here instead
        # of a separate default_server block).
        location = /healthz { access_log off; return 200 "ok\n"; }

        # SSL placeholder — uncomment after running certbot
        # listen 443 ssl;
        # ssl_certificate     /etc/letsencrypt/live/dm3.demasterpro.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/dm3.demasterpro.com/privkey.pem;
        # include /etc/letsencrypt/options-ssl-nginx.conf;
        # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        # if ($scheme != "https") { return 301 https://$host$request_uri; }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ── Service routing by URL prefix (5 services = 5 prefixes) ─────────
        #  /api/v1/auth/**     → auth-svc       :8005
        #  /api/v1/gateway/**  → device-gateway  :8002
        #  /api/v1/identity/** → identity-svc    :8004
        #  /api/v1/access/**   → access-svc      :8003
        #  /api/v1/audit/**    → audit-svc       :8001
        #  /photos/**          → identity-svc    :8004
        #  /ws/**              → device-gateway   :8002
        #
        # To add new API endpoints: just add them in the correct service.
        # Nginx NEVER needs to change unless a brand-new service is added.
        # ──────────────────────────────────────────────────────────────────────

        resolver 127.0.0.11 valid=30s;

        # auth-svc — /api/v1/auth/**
        location /api/v1/auth/ {
            set $upstream_auth http://auth-svc:8005;
            proxy_pass $upstream_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # auth-svc — /api/v1/rbac/** (company roles, permissions, assignments)
        location /api/v1/rbac/ {
            set $upstream_rbac http://auth-svc:8005;
            proxy_pass $upstream_rbac;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # device-gateway — /api/v1/gateway/** (100M for firmware uploads)
        location /api/v1/gateway/ {
            set $upstream_gateway http://device-gateway:8002;
            proxy_pass $upstream_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 100M;
        }

        # access-svc — /api/v1/access/**
        location /api/v1/access/ {
            set $upstream_access http://access-svc:8003;
            proxy_pass $upstream_access;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # identity-svc — /api/v1/identity/** (10M for avatar uploads)
        location /api/v1/identity/ {
            set $upstream_identity http://identity-svc:8004;
            proxy_pass $upstream_identity;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10M;
        }

        # audit-svc — /api/v1/audit/**
        location /api/v1/audit/ {
            set $upstream_audit http://audit-svc:8001;
            proxy_pass $upstream_audit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # visitor-svc — /api/v1/visitors/** (plugin-gated)
        location /api/v1/visitors/ {
            set $upstream_visitor http://visitor-svc:8006;
            proxy_pass $upstream_visitor;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10M;
        }

        # parking-svc — /api/v1/parking/** (plugin-gated)
        location /api/v1/parking/ {
            set $upstream_parking http://parking-svc:8007;
            proxy_pass $upstream_parking;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10M;
        }

        # cctv-svc — /api/v1/cctv/** (plugin-gated, 200M for manual clip uploads)
        location /api/v1/cctv/ {
            set $upstream_cctv http://cctv-svc:8008;
            proxy_pass $upstream_cctv;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 200M;
        }

        # attend-svc — /api/v1/attendance/** (plugin-gated)
        location /api/v1/attendance/ {
            set $upstream_attend http://attend-svc:8010;
            proxy_pass $upstream_attend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MediaMTX — WebRTC/WHEP live view
        location /cctv/whep/ {
            set $upstream_whep http://mediamtx:8889;
            rewrite ^/cctv/whep/(.*)$ /$1 break;
            proxy_pass $upstream_whep;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # MediaMTX — LL-HLS fallback
        location /cctv/hls/ {
            set $upstream_hls http://mediamtx:8888;
            rewrite ^/cctv/hls/(.*)$ /$1 break;
            proxy_pass $upstream_hls;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # identity-svc — uploaded photos/avatars
        location /photos/ {
            set $upstream_photos http://identity-svc:8004;
            proxy_pass $upstream_photos;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket — device-gateway
        location /ws/ {
            set $upstream_ws http://device-gateway:8002;
            proxy_pass $upstream_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # EMQX MQTT over WebSocket — mirrors dm3-mqtt.* block so IP-based
        # installs can use ws://<host>/mqtt without a separate subdomain.
        location /mqtt {
            set $upstream_emqx http://emqx:8083;
            proxy_pass $upstream_emqx;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SPA fallback
        location / {
            set $upstream_webapp http://webapp:80;
            proxy_pass $upstream_webapp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── dm3-api.demasterpro.com — Backend API (direct / mobile) ──────────────
    server {
        listen 80;
        server_name dm3-api.demasterpro.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Company-ID" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        resolver 127.0.0.11 valid=30s;

        location /ws/ {
            set $upstream_ws2 http://device-gateway:8002;
            proxy_pass $upstream_ws2;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/v1/auth/ {
            set $upstream_auth2 http://auth-svc:8005;
            proxy_pass $upstream_auth2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/rbac/ {
            set $upstream_rbac2 http://auth-svc:8005;
            proxy_pass $upstream_rbac2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/gateway/ {
            set $upstream_gateway2 http://device-gateway:8002;
            proxy_pass $upstream_gateway2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 100M;
        }

        location /api/v1/access/ {
            set $upstream_access2 http://access-svc:8003;
            proxy_pass $upstream_access2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/identity/ {
            set $upstream_identity2 http://identity-svc:8004;
            proxy_pass $upstream_identity2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10M;
        }

        location /api/v1/audit/ {
            set $upstream_audit2 http://audit-svc:8001;
            proxy_pass $upstream_audit2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/visitors/ {
            set $upstream_visitor2 http://visitor-svc:8006;
            proxy_pass $upstream_visitor2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10M;
        }

        location /api/v1/parking/ {
            set $upstream_parking2 http://parking-svc:8007;
            proxy_pass $upstream_parking2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10M;
        }

        location /api/v1/cctv/ {
            set $upstream_cctv2 http://cctv-svc:8008;
            proxy_pass $upstream_cctv2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 200M;
        }

        location /api/v1/attendance/ {
            set $upstream_attend2 http://attend-svc:8010;
            proxy_pass $upstream_attend2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /photos/ {
            set $upstream_photos2 http://identity-svc:8004;
            proxy_pass $upstream_photos2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── dm3-mqtt.demasterpro.com — EMQX WebSocket ────────────────────────────
    server {
        listen 80;
        server_name dm3-mqtt.demasterpro.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Use the docker DNS resolver + a variable so emqx is resolved at
        # request time, not at nginx startup. Without this, nginx fails
        # with "host not found" if emqx restarts or is briefly unhealthy.
        resolver 127.0.0.11 valid=30s;

        location /mqtt {
            set $upstream_emqx http://emqx:8083;
            proxy_pass $upstream_emqx;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ── dm3-minio.demasterpro.com — MinIO console (optional) ─────────────────
    server {
        listen 80;
        server_name dm3-minio.demasterpro.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Same docker-DNS + variable upstream trick as the emqx block above.
        # Without this, nginx tries to resolve `minio` at config-load time and
        # exits permanently with "host not found in upstream" whenever the
        # minio container is briefly unhealthy / not yet started — even a
        # service_healthy depends_on can't guarantee order when nginx alone
        # gets recreated (CI redeploy, manual restart, etc.). Variable
        # proxy_pass defers resolution to request time, so nginx starts fine
        # and will pick up minio as soon as it's reachable.
        resolver 127.0.0.11 valid=30s;

        ignore_invalid_headers off;
        client_max_body_size 0;
        proxy_buffering off;

        location / {
            set $upstream_minio http://minio:9001;
            proxy_pass $upstream_minio;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;
            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            chunked_transfer_encoding off;
        }
    }

    # ── dm3-s3.demasterpro.com — MinIO S3 API (presigned URL target) ─────────
    # Public route for presigned PUT/GET URLs so devices (terminal media
    # uploads) and browsers (event photos, clip playback) can reach MinIO
    # from outside the Docker network. Must proxy to :9000 (S3 API), NOT
    # :9001 (console UI).
    #
    # Backend services generate these URLs via OBJECT_STORE_PUBLIC_ENDPOINT
    # in docker-compose.prod.yml. DNS + TLS cert required for this
    # subdomain — add A-record and extend the certbot command in
    # deploy/README.md with `-d dm3-s3.demasterpro.com`.
    server {
        listen 80;
        server_name dm3-s3.demasterpro.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        resolver 127.0.0.11 valid=30s;

        ignore_invalid_headers off;
        # MinIO uploads can be arbitrarily large (clips, snapshots). Let the
        # server-side object-size limits gate the actual max, not nginx.
        client_max_body_size 0;
        # Streaming PUT/GET — no nginx buffering or SHA reads in the middle.
        proxy_buffering off;
        proxy_request_buffering off;

        location / {
            set $upstream_minio http://minio:9000;
            proxy_pass $upstream_minio;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            # Long enough to upload a multi-minute clip on a slow link.
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            chunked_transfer_encoding off;
        }
    }
}
