user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/wasm;
    gzip_min_length 1024;

    # ── Upstream backends ────────────────────────────────────────────────────
    upstream auth_svc       { server auth-svc:8005; }
    upstream identity_svc   { server identity-svc:8004; }
    upstream access_svc     { server access-svc:8003; }
    upstream device_gateway { server device-gateway:8002; }
    upstream webapp         { server webapp:80; }
    upstream emqx_ws        { server emqx:8083; }
    upstream minio_console  { server minio:9001; }

    # ── Helper maps ──────────────────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── dm3.demasterpro.com — React SPA ──────────────────────────────────────
    server {
        listen 80;
        server_name dm3.demasterpro.com;

        # SSL placeholder — uncomment after running certbot
        # listen 443 ssl;
        # ssl_certificate     /etc/letsencrypt/live/dm3.demasterpro.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/dm3.demasterpro.com/privkey.pem;
        # include /etc/letsencrypt/options-ssl-nginx.conf;
        # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        # if ($scheme != "https") { return 301 https://$host$request_uri; }

        # Certbot ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://webapp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── dm3-api.demasterpro.com — Backend API ────────────────────────────────
    server {
        listen 80;
        server_name dm3-api.demasterpro.com;

        # SSL placeholder
        # listen 443 ssl;
        # ssl_certificate     /etc/letsencrypt/live/dm3-api.demasterpro.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/dm3-api.demasterpro.com/privkey.pem;
        # include /etc/letsencrypt/options-ssl-nginx.conf;
        # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        # if ($scheme != "https") { return 301 https://$host$request_uri; }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # CORS headers (applied to all API responses)
        add_header Access-Control-Allow-Origin  "${CORS_ORIGIN:-*}" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Company-ID" always;

        # Preflight fast-return
        if ($request_method = OPTIONS) {
            return 204;
        }

        # WebSocket — device-gateway event stream
        location /ws/ {
            proxy_pass http://device_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # device-gateway — system admin device list (more specific than /api/v1/system)
        location /api/v1/system/devices {
            proxy_pass http://device_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # device-gateway — device provisioning & management
        location /api/v1/devices {
            proxy_pass http://device_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # identity-svc — persons and groups
        location /api/v1/persons {
            proxy_pass http://identity_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/groups {
            proxy_pass http://identity_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # access-svc — doors, rules, events, schedules, stats
        location /api/v1/doors {
            proxy_pass http://access_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/rules {
            proxy_pass http://access_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/events {
            proxy_pass http://access_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/schedules {
            proxy_pass http://access_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/stats {
            proxy_pass http://access_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # auth-svc — auth, users, roles, system (company management)
        location /api/v1/ {
            proxy_pass http://auth_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── dm3-mqtt.demasterpro.com — EMQX WebSocket ────────────────────────────
    server {
        listen 80;
        server_name dm3-mqtt.demasterpro.com;

        # SSL placeholder
        # listen 443 ssl;
        # ssl_certificate     /etc/letsencrypt/live/dm3-mqtt.demasterpro.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/dm3-mqtt.demasterpro.com/privkey.pem;
        # include /etc/letsencrypt/options-ssl-nginx.conf;
        # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        # if ($scheme != "https") { return 301 https://$host$request_uri; }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /mqtt {
            proxy_pass http://emqx_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ── dm3-minio.demasterpro.com — MinIO console (optional) ─────────────────
    server {
        listen 80;
        server_name dm3-minio.demasterpro.com;

        # SSL placeholder
        # listen 443 ssl;
        # ssl_certificate     /etc/letsencrypt/live/dm3-minio.demasterpro.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/dm3-minio.demasterpro.com/privkey.pem;
        # include /etc/letsencrypt/options-ssl-nginx.conf;
        # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        # if ($scheme != "https") { return 301 https://$host$request_uri; }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # MinIO console requires special headers
        ignore_invalid_headers off;
        client_max_body_size 0;
        proxy_buffering off;

        location / {
            proxy_pass http://minio_console;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;
            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            chunked_transfer_encoding off;
        }
    }
}
