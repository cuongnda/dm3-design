user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Use Docker internal DNS — resolves service names dynamically
    # This prevents nginx from crashing when an upstream is temporarily down
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Helper maps ──────────────────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Proxy helper: standard headers ───────────────────────────────────────
    # (reused via include-like patterns below)

    # ── dm3.demasterpro.com — React SPA ──────────────────────────────────────
    server {
        listen 80;
        server_name dm3.demasterpro.com;

        # SSL placeholder — uncomment after running certbot
        # listen 443 ssl;
        # ssl_certificate     /etc/letsencrypt/live/dm3.demasterpro.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/dm3.demasterpro.com/privkey.pem;
        # include /etc/letsencrypt/options-ssl-nginx.conf;
        # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        # if ($scheme != "https") { return 301 https://$host$request_uri; }

        # Certbot ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ── API proxy — webapp uses relative /api/v1/ URLs ───────────────────
        # Order: more specific routes first

        # device-gateway — system admin device list
        location /api/v1/system/devices {
            set $upstream_device_gw http://device-gateway:8002;
            proxy_pass $upstream_device_gw;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # device-gateway
        location /api/v1/devices {
            set $upstream_device_gw http://device-gateway:8002;
            proxy_pass $upstream_device_gw;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # identity-svc
        location /api/v1/persons {
            set $upstream_identity http://identity-svc:8004;
            proxy_pass $upstream_identity;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/v1/groups {
            set $upstream_identity http://identity-svc:8004;
            proxy_pass $upstream_identity;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # access-svc
        location /api/v1/doors {
            set $upstream_access http://access-svc:8003;
            proxy_pass $upstream_access;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/v1/rules {
            set $upstream_access http://access-svc:8003;
            proxy_pass $upstream_access;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/v1/events {
            set $upstream_access http://access-svc:8003;
            proxy_pass $upstream_access;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/v1/schedules {
            set $upstream_access http://access-svc:8003;
            proxy_pass $upstream_access;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/v1/stats {
            set $upstream_access http://access-svc:8003;
            proxy_pass $upstream_access;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # notif-svc
        location /api/v1/notifications {
            set $upstream_notif http://notif-svc:8009;
            proxy_pass $upstream_notif;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # audit-svc
        location /api/v1/audit {
            set $upstream_audit http://audit-svc:8010;
            proxy_pass $upstream_audit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # visitor-svc
        location /api/v1/visitors {
            set $upstream_visitor http://visitor-svc:8006;
            proxy_pass $upstream_visitor;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # visitor-svc public endpoints (no auth required)
        location /api/v1/public/visitors {
            set $upstream_visitor http://visitor-svc:8006;
            proxy_pass $upstream_visitor;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # attend-svc
        location /api/v1/attendance {
            set $upstream_attend http://attend-svc:8007;
            proxy_pass $upstream_attend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # attend-svc public endpoints (no auth required)
        location /api/v1/public/attendance {
            set $upstream_attend http://attend-svc:8007;
            proxy_pass $upstream_attend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_Set_header X-Forwarded-Proto $scheme;
        }

        # auth-svc — catch-all for /api/v1/ (auth, users, roles, system)
        location /api/v1/ {
            set $upstream_auth http://auth-svc:8005;
            proxy_pass $upstream_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket
        location /ws/ {
            set $upstream_device_gw http://device-gateway:8002;
            proxy_pass $upstream_device_gw;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SPA fallback
        location / {
            set $upstream_webapp http://webapp:80;
            proxy_pass $upstream_webapp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── dm3-api.demasterpro.com — Backend API ────────────────────────────────
    server {
        listen 80;
        server_name dm3-api.demasterpro.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # CORS headers
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Company-ID" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # WebSocket
        location /ws/ {
            set $upstream_device_gw http://device-gateway:8002;
            proxy_pass $upstream_device_gw;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/v1/system/devices {
            set $upstream_device_gw http://device-gateway:8002;
            proxy_pass $upstream_device_gw;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/devices {
            set $upstream_device_gw http://device-gateway:8002;
            proxy_pass $upstream_device_gw;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/persons {
            set $upstream_identity http://identity-svc:8004;
            proxy_pass $upstream_identity;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/groups {
            set $upstream_identity http://identity-svc:8004;
            proxy_pass $upstream_identity;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/doors {
            set $upstream_access http://access-svc:8003;
            proxy_pass $upstream_access;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/rules {
            set $upstream_access http://access-svc:8003;
            proxy_pass $upstream_access;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/events {
            set $upstream_access http://access-svc:8003;
            proxy_pass $upstream_access;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/schedules {
            set $upstream_access http://access-svc:8003;
            proxy_pass $upstream_access;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/stats {
            set $upstream_access http://access-svc:8003;
            proxy_pass $upstream_access;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/notifications {
            set $upstream_notif http://notif-svc:8009;
            proxy_pass $upstream_notif;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/audit {
            set $upstream_audit http://audit-svc:8010;
            proxy_pass $upstream_audit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/visitors {
            set $upstream_visitor http://visitor-svc:8006;
            proxy_pass $upstream_visitor;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/public/visitors {
            set $upstream_visitor http://visitor-svc:8006;
            proxy_pass $upstream_visitor;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/ {
            set $upstream_auth http://auth-svc:8005;
            proxy_pass $upstream_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── dm3-mqtt.demasterpro.com — EMQX WebSocket ────────────────────────────
    server {
        listen 80;
        server_name dm3-mqtt.demasterpro.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /mqtt {
            set $upstream_emqx http://emqx:8083;
            proxy_pass $upstream_emqx;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ── dm3-minio.demasterpro.com — MinIO console (optional) ─────────────────
    server {
        listen 80;
        server_name dm3-minio.demasterpro.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        ignore_invalid_headers off;
        client_max_body_size 0;
        proxy_buffering off;

        location / {
            set $upstream_minio http://minio:9001;
            proxy_pass $upstream_minio;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;
            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            chunked_transfer_encoding off;
        }
    }
}
