user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/wasm;
    gzip_min_length 1024;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Health check (default server) ─────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        location /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 444;
        }
    }

    # ── dm3.demasterpro.com — React SPA ──────────────────────────────────────
    server {
        listen 80;
        server_name dm3.demasterpro.com;

        # SSL placeholder — uncomment after running certbot
        # listen 443 ssl;
        # ssl_certificate     /etc/letsencrypt/live/dm3.demasterpro.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/dm3.demasterpro.com/privkey.pem;
        # include /etc/letsencrypt/options-ssl-nginx.conf;
        # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        # if ($scheme != "https") { return 301 https://$host$request_uri; }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ── Service routing by URL prefix (4 services = 4 prefixes) ─────────
        #  /api/v1/auth/**     → auth-svc       :8005
        #  /api/v1/gateway/**  → device-gateway  :8002
        #  /api/v1/identity/** → identity-svc    :8004
        #  /api/v1/access/**   → access-svc      :8003
        #  /photos/**          → identity-svc    :8004
        #  /ws/**              → device-gateway   :8002
        #
        # To add new API endpoints: just add them in the correct service.
        # Nginx NEVER needs to change unless a brand-new service is added.
        # ──────────────────────────────────────────────────────────────────────

        # auth-svc — /api/v1/auth/**
        location /api/v1/auth/ {
            proxy_pass http://auth-svc:8005;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # device-gateway — /api/v1/gateway/** (100M for firmware uploads)
        location /api/v1/gateway/ {
            proxy_pass http://device-gateway:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 100M;
        }

        # access-svc — /api/v1/access/**
        location /api/v1/access/ {
            proxy_pass http://access-svc:8003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # identity-svc — /api/v1/identity/**
        location /api/v1/identity/ {
            proxy_pass http://identity-svc:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # identity-svc — uploaded photos/avatars
        location /photos/ {
            proxy_pass http://identity-svc:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket — device-gateway
        location /ws/ {
            proxy_pass http://device-gateway:8002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SPA fallback
        location / {
            proxy_pass http://webapp:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── dm3-api.demasterpro.com — Backend API (direct / mobile) ──────────────
    server {
        listen 80;
        server_name dm3-api.demasterpro.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Company-ID" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location /ws/ {
            proxy_pass http://device-gateway:8002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/v1/auth/ {
            proxy_pass http://auth-svc:8005;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/gateway/ {
            proxy_pass http://device-gateway:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 100M;
        }

        location /api/v1/access/ {
            proxy_pass http://access-svc:8003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/identity/ {
            proxy_pass http://identity-svc:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /photos/ {
            proxy_pass http://identity-svc:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── dm3-mqtt.demasterpro.com — EMQX WebSocket ────────────────────────────
    server {
        listen 80;
        server_name dm3-mqtt.demasterpro.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /mqtt {
            proxy_pass http://emqx:8083;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ── dm3-minio.demasterpro.com — MinIO console (optional) ─────────────────
    server {
        listen 80;
        server_name dm3-minio.demasterpro.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        ignore_invalid_headers off;
        client_max_body_size 0;
        proxy_buffering off;

        location / {
            proxy_pass http://minio:9001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;
            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            chunked_transfer_encoding off;
        }
    }
}
