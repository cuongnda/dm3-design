# ── Shared build config ─────────────────────────────────────────────────────
# All backend services share a single Dockerfile and produce a single image.
# Declaring one named image lets Compose build once and reuse it across all
# 10 services instead of rebuilding the identical artifact per service.
x-backend-build: &backend-build
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: dm3-backend:local

# ── Shared object-store env ─────────────────────────────────────────────────
# Every service that signs MinIO URLs (access-svc, device-gateway, identity-svc,
# cctv-svc, visitor-svc, attend-svc) must see the same config, otherwise the
# service falls back to the dev default (localhost:9002) and presigns fail at
# runtime. PUBLIC_ENDPOINT is the host baked into presigned URLs — it must be
# something devices and browsers outside the Docker network can reach.
# nginx's dm3-s3.* server block proxies to minio:9000 (S3 API, not :9001 which
# is the console UI).
x-object-store-env: &object-store-env
  OBJECT_STORE_ENDPOINT: minio:9000
  OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:-dm3admin}
  OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
  OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-dm3}
  OBJECT_STORE_USE_SSL: "false"
  OBJECT_STORE_AUTO_CREATE_BUCKET: "true"
  # Public host routes through Cloudflare → origin nginx → minio:9000.
  # USE_SSL=false because Cloudflare terminates TLS at the edge and talks
  # HTTP to origin; presigned URLs ride the same http→https 301 the rest
  # of the prod stack uses. Override via GitLab CI/CD variables if either
  # value ever needs to differ per environment.
  OBJECT_STORE_PUBLIC_ENDPOINT: ${OBJECT_STORE_PUBLIC_ENDPOINT:-dm3-s3.demasterpro.com}
  OBJECT_STORE_PUBLIC_USE_SSL: ${OBJECT_STORE_PUBLIC_USE_SSL:-false}

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: dm3-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dm3}
      POSTGRES_USER: ${DB_USER:-dm3}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dm3}"]
      interval: 5s
      timeout: 5s
      retries: 10

  emqx:
    image: emqx/emqx:5.8.3
    container_name: dm3-emqx
    restart: unless-stopped
    environment:
      EMQX_NAME: dm3
      EMQX_LOADED_PLUGINS: "emqx_dashboard"
    volumes:
      - emqx_data:/opt/emqx/data
    ports:
      - "1884:1883"
      - "8884:8883"
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      # EMQX 5.x on contended CI runners can take 60-90s to settle — the
      # Erlang VM logs "long_schedule" warnings as the scheduler is
      # blocked, and `emqx ctl status` is an RPC so it inherits that
      # blocking. start_period tells Docker not to count failures in the
      # first 90s against `retries`, giving the broker a real boot window.
      # Interval + timeout stay conservative so steady-state probes are
      # still fast.
      start_period: 90s
      interval: 10s
      timeout: 10s
      retries: 20

  nats:
    image: nats:2.10-alpine
    container_name: dm3-nats
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: dm3-valkey
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: dm3-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dm3admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Migration (init container — runs once then exits) ──────────────────────

  migrate:
    <<: *backend-build
    container_name: dm3-migrate
    environment:
      SERVICE_NAME: migrate
      DATABASE_URL: postgres://${DB_USER:-dm3}:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@timescaledb:5432/${DB_NAME:-dm3}?sslmode=disable
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - dm3-internal
    restart: "no"

  # ── Backend services ───────────────────────────────────────────────────────

  auth-svc:
    <<: *backend-build
    container_name: dm3-auth-svc
    restart: unless-stopped
    environment:
      SERVICE_NAME: auth-svc
      HTTP_PORT: "8005"
      DATABASE_URL: postgres://${DB_USER:-dm3}:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@timescaledb:5432/${DB_NAME:-dm3}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      NATS_URL: nats://nats:4222
      MQTT_BROKER: tcp://emqx:1883
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-DeMasterPro}
      SMTP_FROM_ADDR: ${SMTP_FROM_ADDR:-info@demasterpro.com}
      APP_URL: ${APP_URL:-https://dm3.demasterpro.com}
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8005/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-svc:
    <<: *backend-build
    container_name: dm3-identity-svc
    restart: unless-stopped
    environment:
      <<: *object-store-env
      SERVICE_NAME: identity-svc
      HTTP_PORT: "8004"
      DATABASE_URL: postgres://${DB_USER:-dm3}:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@timescaledb:5432/${DB_NAME:-dm3}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      NATS_URL: nats://nats:4222
      MQTT_BROKER: tcp://emqx:1883
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-DeMasterPro}
      SMTP_FROM_ADDR: ${SMTP_FROM_ADDR:-info@demasterpro.com}
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8004/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  access-svc:
    <<: *backend-build
    container_name: dm3-access-svc
    restart: unless-stopped
    environment:
      <<: *object-store-env
      SERVICE_NAME: access-svc
      HTTP_PORT: "8003"
      DATABASE_URL: postgres://${DB_USER:-dm3}:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@timescaledb:5432/${DB_NAME:-dm3}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      NATS_URL: nats://nats:4222
      MQTT_BROKER: tcp://emqx:1883
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8003/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  audit-svc:
    <<: *backend-build
    container_name: dm3-audit-svc
    restart: unless-stopped
    environment:
      SERVICE_NAME: audit-svc
      HTTP_PORT: "8001"
      DATABASE_URL: postgres://${DB_USER:-dm3}:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@timescaledb:5432/${DB_NAME:-dm3}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      NATS_URL: nats://nats:4222
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  device-gateway:
    <<: *backend-build
    container_name: dm3-device-gateway
    restart: unless-stopped
    environment:
      <<: *object-store-env
      SERVICE_NAME: device-gateway
      HTTP_PORT: "8002"
      DATABASE_URL: postgres://${DB_USER:-dm3}:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@timescaledb:5432/${DB_NAME:-dm3}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      NATS_URL: nats://nats:4222
      MQTT_BROKER: tcp://emqx:1883
      VALKEY_URL: valkey:6379
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:?BOOTSTRAP_SECRET must be set in .env}
      KNOWN_APP_SIGNATURES: ${KNOWN_APP_SIGNATURES:-}
      # Shared with cctv-svc: required to provision type=camera devices via
      # /api/v1/gateway/devices/provision (encrypts RTSP password at rest).
      CCTV_CREDENTIAL_KEY: ${CCTV_CREDENTIAL_KEY:?CCTV_CREDENTIAL_KEY must be set in .env (32+ chars)}
      WS_ALLOWED_ORIGINS: "https://dm3.demasterpro.com,http://dm3.demasterpro.com"
    depends_on:
      migrate:
        condition: service_completed_successfully
      emqx:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  visitor-svc:
    <<: *backend-build
    container_name: dm3-visitor-svc
    restart: unless-stopped
    environment:
      <<: *object-store-env
      SERVICE_NAME: visitor-svc
      HTTP_PORT: "8006"
      DATABASE_URL: postgres://${DB_USER:-dm3}:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@timescaledb:5432/${DB_NAME:-dm3}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      NATS_URL: nats://nats:4222
      MQTT_BROKER: tcp://emqx:1883
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8006/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  parking-svc:
    <<: *backend-build
    container_name: dm3-parking-svc
    restart: unless-stopped
    environment:
      SERVICE_NAME: parking-svc
      HTTP_PORT: "8007"
      DATABASE_URL: postgres://${DB_USER:-dm3}:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@timescaledb:5432/${DB_NAME:-dm3}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      NATS_URL: nats://nats:4222
      MQTT_BROKER: tcp://emqx:1883
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8007/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  attend-svc:
    <<: *backend-build
    container_name: dm3-attend-svc
    restart: unless-stopped
    environment:
      <<: *object-store-env
      SERVICE_NAME: attend-svc
      HTTP_PORT: "8010"
      DATABASE_URL: postgres://${DB_USER:-dm3}:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@timescaledb:5432/${DB_NAME:-dm3}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      NATS_URL: nats://nats:4222
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8010/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MediaMTX — RTSP ingest + WebRTC/WHEP + LL-HLS egress ───────────────────
  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    container_name: dm3-mediamtx
    restart: unless-stopped
    environment:
      MTX_API: "yes"
      MTX_APIADDRESS: ":9997"
      MTX_WEBRTCADDRESS: ":8889"
      MTX_HLSADDRESS: ":8888"
      MTX_HLSVARIANT: "lowLatency"
      MTX_RTSPADDRESS: ":8554"
      # Advertise the server's public IP as ICE candidate so browsers can
      # reach WebRTC from outside Docker bridge network.
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_PUBLIC_IP:-52.74.195.243}
      MTX_WEBRTCLOCALUDPADDRESS: ":8189"
      # Auth: admin user for API + anonymous read for WHEP/HLS viewers
      MTX_AUTHMETHOD: "internal"
      MTX_AUTHINTERNALUSERS_0_USER: ${MEDIAMTX_API_USER:-dm3admin}
      MTX_AUTHINTERNALUSERS_0_PASS: ${MEDIAMTX_API_PASS:-}
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: "api"
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_1_ACTION: "publish"
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_2_ACTION: "read"
      MTX_AUTHINTERNALUSERS_1_USER: ""
      MTX_AUTHINTERNALUSERS_1_PASS: ""
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_ACTION: "read"
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_1_ACTION: "playback"
    ports:
      - "8889:8889"
      - "8189:8189/udp"
    networks:
      - dm3-internal
    # mediamtx image is distroless (no wget/curl). We rely on the service
    # starting (port binding is visible in logs) plus cctv-svc's own retries
    # against the :9997 API instead of a docker healthcheck.

  cctv-svc:
    <<: *backend-build
    container_name: dm3-cctv-svc
    restart: unless-stopped
    environment:
      <<: *object-store-env
      SERVICE_NAME: cctv-svc
      HTTP_PORT: "8008"
      DATABASE_URL: postgres://${DB_USER:-dm3}:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@timescaledb:5432/${DB_NAME:-dm3}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      NATS_URL: nats://nats:4222
      CCTV_CREDENTIAL_KEY: ${CCTV_CREDENTIAL_KEY:?CCTV_CREDENTIAL_KEY must be set in .env (32+ chars)}
      MEDIAMTX_API_URL: "http://mediamtx:9997"
      MEDIAMTX_API_USER: ${MEDIAMTX_API_USER:-}
      MEDIAMTX_API_PASS: ${MEDIAMTX_API_PASS:-}
      MEDIAMTX_WHEP_BASE: ${MEDIAMTX_WHEP_BASE:-/cctv/whep}
      MEDIAMTX_HLS_BASE: ${MEDIAMTX_HLS_BASE:-/cctv/hls}
      CCTV_ALLOW_PRIVATE_RTSP: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      mediamtx:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8008/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend ───────────────────────────────────────────────────────────────

  webapp:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    image: dm3-webapp:local
    container_name: dm3-webapp
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-https://dm3-api.demasterpro.com}
      MQTT_WS_URL: ${MQTT_WS_URL:-wss://dm3-mqtt.demasterpro.com/mqtt}
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Reverse proxy ──────────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: dm3-nginx
    restart: unless-stopped
    # No host ports — main reverse proxy (dmpw-net) routes to this container
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      webapp:
        condition: service_healthy
      auth-svc:
        condition: service_healthy
      identity-svc:
        condition: service_healthy
      access-svc:
        condition: service_healthy
      device-gateway:
        condition: service_healthy
      audit-svc:
        condition: service_healthy
      visitor-svc:
        condition: service_healthy
      parking-svc:
        condition: service_healthy
      cctv-svc:
        condition: service_healthy
      attend-svc:
        condition: service_healthy
      emqx:
        condition: service_healthy
      # nginx proxies the MinIO console (dm3-minio.demasterpro.com server block)
      # and resolves upstreams once at config-load; without this dependency the
      # container dies with "host not found in upstream 'minio'" on cold start.
      minio:
        condition: service_healthy
    networks:
      - dm3-internal
      - dmpw-net  # join main proxy network for direct container routing
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Simulator (staging only) ───────────────────────────────────────────────

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    image: dm3-simulator:local
    container_name: dm3-simulator
    restart: unless-stopped
    environment:
      DM3_BROKER: mqtt://emqx:1883
      DM3_DEVICES: 5
      DM3_API_PORT: 9090
      DM3_BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:-dm3-bootstrap-v1-dev-secret}
      # Used by the §15 media upload flow — POST /devices/{id}/media-url
      DM3_GATEWAY_URL: http://device-gateway:8002
    ports:
      - "9091:9090"
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - dm3-internal
    command: ["run", "--broker", "mqtt://emqx:1883", "--devices", "5"]
    profiles:
      - staging

  # ── Automation Test Runner ─────────────────────────────────────────────────

  automation:
    build:
      context: .
      dockerfile: automation/Dockerfile
    image: dm3-automation:local
    container_name: dm3-automation
    restart: unless-stopped
    environment:
      API_URL: http://nginx:80
      WEB_URL: http://nginx:80
      REPORT_PREFIX: dm3
      HEADLESS: "true"
      GENERATE_VIDEO: "true"
      TZ: Asia/Bangkok
      HEALTH_TIMEOUT: "180"
      RUN_ON_STARTUP: ${AUTOMATION_RUN_ON_STARTUP:-changed}
      CRON_SCHEDULE: ${AUTOMATION_CRON:-0 2 * * *}
      CI_COMMIT_SHA: ${CI_COMMIT_SHA:-}
      CI_COMMIT_BEFORE_SHA: ${CI_COMMIT_BEFORE_SHA:-}
    env_file:
      - /home/gitlab-runner/.env.dm3.automation
    volumes:
      - automation_data:/app/automation/export
    depends_on:
      nginx:
        condition: service_healthy
      auth-svc:
        condition: service_healthy
      identity-svc:
        condition: service_healthy
      access-svc:
        condition: service_healthy
      device-gateway:
        condition: service_healthy
    networks:
      - dm3-internal
    profiles:
      - test

volumes:
  timescaledb_data:
  emqx_data:
  nats_data:
  valkey_data:
  minio_data:
  certbot_webroot:
  automation_data:

networks:
  dm3-internal:
    driver: bridge
  dmpw-net:
    external: true  # main reverse proxy network
