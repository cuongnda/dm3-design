services:
  # ── Infrastructure ─────────────────────────────────────────────────────────

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: dm3-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dm3}
      POSTGRES_USER: ${DB_USER:-dm3}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dm3}"]
      interval: 5s
      timeout: 5s
      retries: 10

  emqx:
    image: emqx/emqx:5.8.3
    container_name: dm3-emqx
    restart: unless-stopped
    environment:
      EMQX_NAME: dm3
      EMQX_LOADED_PLUGINS: "emqx_dashboard"
    volumes:
      - emqx_data:/opt/emqx/data
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: dm3-nats
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: dm3-valkey
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: dm3-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dm3admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Migration (init container — runs once then exits) ──────────────────────

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dm3-migrate
    environment:
      SERVICE_NAME: migrate
      DATABASE_URL: postgres://${DB_USER:-dm3}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME:-dm3}?sslmode=disable
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - dm3-internal
    restart: "no"

  # ── Backend services ───────────────────────────────────────────────────────

  auth-svc:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dm3-auth-svc
    restart: unless-stopped
    environment:
      SERVICE_NAME: auth-svc
      HTTP_PORT: "8005"
      DATABASE_URL: postgres://${DB_USER:-dm3}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME:-dm3}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      NATS_URL: nats://nats:4222
      MQTT_BROKER: tcp://emqx:1883
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8005/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-svc:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dm3-identity-svc
    restart: unless-stopped
    environment:
      SERVICE_NAME: identity-svc
      HTTP_PORT: "8004"
      DATABASE_URL: postgres://${DB_USER:-dm3}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME:-dm3}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      NATS_URL: nats://nats:4222
      MQTT_BROKER: tcp://emqx:1883
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8004/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  access-svc:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dm3-access-svc
    restart: unless-stopped
    environment:
      SERVICE_NAME: access-svc
      HTTP_PORT: "8003"
      DATABASE_URL: postgres://${DB_USER:-dm3}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME:-dm3}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      NATS_URL: nats://nats:4222
      MQTT_BROKER: tcp://emqx:1883
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8003/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  device-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dm3-device-gateway
    restart: unless-stopped
    environment:
      SERVICE_NAME: device-gateway
      HTTP_PORT: "8002"
      DATABASE_URL: postgres://${DB_USER:-dm3}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME:-dm3}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      NATS_URL: nats://nats:4222
      MQTT_BROKER: tcp://emqx:1883
      VALKEY_URL: valkey:6379
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET}
      KNOWN_APP_SIGNATURES: ${KNOWN_APP_SIGNATURES:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      emqx:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend ───────────────────────────────────────────────────────────────

  webapp:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    container_name: dm3-webapp
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-https://dm3-api.demasterpro.com}
      MQTT_WS_URL: ${MQTT_WS_URL:-wss://dm3-mqtt.demasterpro.com/mqtt}
    networks:
      - dm3-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Reverse proxy ──────────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: dm3-nginx
    restart: unless-stopped
    # No host ports — main reverse proxy (dmpw-net) routes to this container
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      webapp:
        condition: service_healthy
      auth-svc:
        condition: service_healthy
      identity-svc:
        condition: service_healthy
      access-svc:
        condition: service_healthy
      device-gateway:
        condition: service_healthy
    networks:
      - dm3-internal
      - dmpw-net  # join main proxy network for direct container routing

  # ── Simulator (staging only) ───────────────────────────────────────────────

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: dm3-simulator
    restart: unless-stopped
    environment:
      DM3_BROKER: mqtt://emqx:1883
      DM3_DEVICES: 5
      DM3_API_PORT: 9090
      DM3_BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:-dm3-bootstrap-v1-dev-secret}
    ports:
      - "9091:9090"
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - dm3-internal
    command: ["run", "--broker", "mqtt://emqx:1883", "--devices", "5"]
    profiles:
      - staging

  # ── Automation Test Runner ─────────────────────────────────────────────────

  automation:
    build:
      context: .
      dockerfile: automation/Dockerfile
    container_name: dm3-automation
    restart: unless-stopped
    environment:
      API_BASE_URL: http://nginx:80
      API_URL: http://nginx:80
      API_AUTH: http://nginx:80
      API_IDENTITY: http://nginx:80
      API_ACCESS: http://nginx:80
      API_GATEWAY: http://nginx:80
      WEB_URL: http://nginx:80
      WEB_BASE_URL: http://nginx:80
      HOST_WEB: http://dm3.demasterpro.com
      BASE_URL: http://nginx:80
      SYSADMIN_EMAIL: sysadmin@duali.com
      SYSADMIN_PASSWORD: sysadmin123
      ADMIN_EMAIL: admin@duali.com
      ADMIN_PASSWORD: admin123
      REPORT_UPLOAD_URL: https://tasks.duali.vn/api/automation/upload
      REPORT_UPLOAD_TOKEN: ${REPORT_UPLOAD_TOKEN:-}
      REPORT_PREFIX: dm3
      HEADLESS: "true"
      GENERATE_VIDEO: "true"
      TZ: Asia/Bangkok
      HEALTH_TIMEOUT: "180"
      RUN_ON_STARTUP: ${AUTOMATION_RUN_ON_STARTUP:-changed}
      CRON_SCHEDULE: ${AUTOMATION_CRON:-0 2 * * *}
      CI_COMMIT_SHA: ${CI_COMMIT_SHA:-}
      CI_COMMIT_BEFORE_SHA: ${CI_COMMIT_BEFORE_SHA:-}
    volumes:
      - automation_data:/app/automation/export
    depends_on:
      nginx:
        condition: service_started
      auth-svc:
        condition: service_healthy
      access-svc:
        condition: service_healthy
      device-gateway:
        condition: service_healthy
    networks:
      - dm3-internal
    profiles:
      - test

volumes:
  timescaledb_data:
  emqx_data:
  nats_data:
  valkey_data:
  minio_data:
  certbot_webroot:
  automation_data:

networks:
  dm3-internal:
    driver: bridge
  dmpw-net:
    external: true  # main reverse proxy network
